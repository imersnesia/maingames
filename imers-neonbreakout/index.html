<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>iMers Neon Breakout</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050510;
    }

    .game-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050510;
    }

    .game-wrapper iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: #050510;
    }
  </style>
</head>

<body>
  <div class="game-wrapper">
    <iframe
      src="https://script.google.com/macros/s/AKfycbzV1j2At5NoVV--vwdzlMroCQ2mpeXawFRIL40pDekL1L6SQ3QdhEo_iQ5QIUtbG-0bZg/exec"
      title="iMers Neon Breakout"
      allow="autoplay; fullscreen"
      allowfullscreen
      scrolling="no"
    ></iframe>
  </div>
</body>
</html>
